services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ctech-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ctech_v3}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ctech_v3}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ctech-network

  # ----------------------------------------------------------------------------
  # C-Tech Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ctech-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-ctech_v3}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_jwt_access_secret_change_me_institution}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_jwt_refresh_secret_change_me_institution}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174}
      DB_POOL_MAX: 25
      DB_POOL_MIN: 4
      DB_IDLE_TIMEOUT_MS: 30000
      DB_CONNECT_TIMEOUT_MS: 5000
      # Transactional Email Providers
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"C-Tech Trade Desk" <security@ctech.trade>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      # Transactional SMS Gateways
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_FLOW_ID: ${MSG91_FLOW_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-uploads:/usr/src/app/uploads
    networks:
      - ctech-network

  # ----------------------------------------------------------------------------
  # C-Tech Frontend React SPA + Nginx Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: ctech-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ctech-network

volumes:
  pgdata:
  backend-uploads:

networks:
  ctech-network:
    driver: bridge
